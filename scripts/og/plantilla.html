<!doctype html>
<!-- Plantilla de la imagen para compartir (1200×630). El idioma sale del hash: #es o #en. Se genera con scripts/og/generar.sh. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('geist.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('geist-mono.woff2') format('woff2');
        font-weight: 400 500;
      }

      :root {
        --paper: #ffffff;
        --surface: #ffffff;
        --ink: #0b1030;
        --ink-soft: #4a5373;
        --muted: #5d6685;
        --line: #e3e9f2;
        --pass: #1d63b0;
        --pass-soft: #e8f5fe;
        --pass-ink: #1d63b0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 430px;
        gap: 56px;
        align-items: center;
        padding: 64px 72px;
        background-color: var(--paper);
        background-image: radial-gradient(60% 70% at 30% 0%, rgb(183 230 252 / 0.6), transparent 70%),
          radial-gradient(rgb(11 16 48 / 0.08) 1.2px, transparent 1.2px);
        background-size: auto, 24px 24px;
        color: var(--ink);
        font-family: 'Geist', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .mono {
        font-family: 'Geist Mono', monospace;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border: 1px solid rgb(29 99 176 / 0.18);
        border-radius: 999px;
        background: var(--pass-soft);
        color: var(--pass-ink);
        font-size: 17px;
        font-weight: 500;
      }

      .eyebrow::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--pass);
      }

      h1 {
        margin-top: 26px;
        font-size: 66px;
        line-height: 1.02;
        font-weight: 600;
        letter-spacing: -0.05em;
      }

      .accent {
        color: var(--pass);
      }

      .lead {
        margin-top: 26px;
        max-width: 560px;
        font-size: 27px;
        line-height: 1.35;
        color: var(--ink-soft);
      }

      .sign {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 44px;
      }

      .mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--ink);
        color: #ffffff;
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.04em;
      }

      .mark::after {
        content: '';
        position: absolute;
        top: 7px;
        right: 7px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #5198d5;
      }

      .name {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .url {
        margin-top: 2px;
        font-size: 17px;
        color: var(--muted);
      }

      .card {
        padding: 30px 30px 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 30px 60px -20px rgb(14 17 22 / 0.18);
      }

      .card-label {
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      ol {
        position: relative;
        margin-top: 22px;
        padding: 0;
        list-style: none;
      }

      ol::before {
        content: '';
        position: absolute;
        top: 26px;
        bottom: 26px;
        left: 13px;
        width: 2px;
        background: linear-gradient(var(--pass), var(--pass-soft));
      }

      li {
        position: relative;
        display: grid;
        grid-template-columns: 28px 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 12px 0;
      }

      .dot {
        justify-self: center;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--pass);
        box-shadow: 0 0 0 5px var(--surface);
      }

      .row-title {
        font-size: 21px;
        font-weight: 600;
      }

      .row-detail {
        margin-top: 2px;
        font-size: 13.5px;
        color: var(--muted);
      }

      .status {
        font-size: 14px;
        color: var(--pass-ink);
      }

      .checks {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }

      .check {
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--pass-soft);
        color: var(--pass-ink);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="sign">
        <span class="mark">BT</span>
        <div>
          <p class="name">Bautista Tolloni</p>
          <p class="url mono">bautolloni-png.github.io</p>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="card-label mono" data-t="cardLabel"></p>
      <ol data-t="rows"></ol>
      <div class="checks mono">
        <span class="check">✓ SPF pass</span>
        <span class="check">✓ DKIM pass</span>
        <span class="check">✓ DMARC pass</span>
      </div>
    </div>

    <script>
      const textos = {
        es: {
          eyebrow: 'Prospección B2B automatizada',
          title: 'Automatizo la <span class="accent">prospección B2B</span> de tu empresa.',
          lead: 'Lista de prospectos, correos personalizados, dominios de envío y respuestas conectadas a tu CRM.',
          cardLabel: 'Así funciona tu outbound',
          rows: [
            ['Lista de prospectos', 'Sales Navigator', 'segmentada'],
            ['Correo personalizado', 'n8n + IA · revisada', 'aprobado'],
            ['Bandeja de entrada', 'dominio autenticado', 'entregado'],
            ['Respuesta → CRM', 'Respondió → Reunión', 'asignada'],
          ],
        },
        en: {
          eyebrow: 'Automated B2B outbound',
          title: 'I automate your company’s <span class="accent">B2B outbound.</span>',
          lead: 'Prospect lists, personalised emails, sending domains and replies connected to your CRM.',
          cardLabel: 'How your outbound works',
          rows: [
            ['Prospect list', 'Sales Navigator', 'segmented'],
            ['Personalised email', 'n8n + AI · reviewed', 'approved'],
            ['Inbox', 'authenticated domain', 'delivered'],
            ['Reply → CRM', 'Replied → Meeting', 'assigned'],
          ],
        },
      };

      const t = textos[location.hash.slice(1)] ?? textos.es;
      document.documentElement.lang = location.hash.slice(1) || 'es';
      for (const el of document.querySelectorAll('[data-t]')) {
        const key = el.dataset.t;
        if (key === 'rows') {
          el.innerHTML = t.rows
            .map(
              ([title, detail, status]) => `
              <li>
                <span class="dot"></span>
                <span><span class="row-title" style="display:block">${title}</span><span class="row-detail mono" style="display:block">${detail}</span></span>
                <span class="status mono">${status}</span>
              </li>`,
            )
            .join('');
        } else {
          el.innerHTML = t[key];
        }
      }
    </script>
  </body>
</html>
